org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=false

# Flutter may use compileSdk 36; AGP 8.8.x is validated through 35—suppress the advisory warning.
android.suppressUnsupportedCompileSdk=36

# Native libs stay uncompressed so AGP 8.5.1+ can 16 KB–align them in App Bundles (Play requirement).
android.bundle.enableUncompressedNativeLibs=true
